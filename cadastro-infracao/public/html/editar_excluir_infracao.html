<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar e Excluir - SIGAI</title>
    <!-- Caminho atualizado para a pasta CSS com a nova rota -->
    <link rel="stylesheet" href="/cadastro-infracao/css/style.css">
    <!-- Font Awesome (Ícones do menu) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-current-page="editar-infracao">
    <!-- Menu Lateral (Sidebar) -->

    <main class="main-content">
        <header class="top-header">
            <div>
                <h1>Sistema de Gerenciamento de Autos de Infração</h1>
                <p>Prefeitura Municipal • Gerência de Posturas</p>
            </div>
            <div class="user-profile">
                <div class="user-info">
                    <strong id="nome-usuario">Carregando...</strong>
                    <span id="cargo-usuario">Carregando...</span>
                </div>
                <div class="avatar" id="avatar-letra">-</div>
            </div>
        </header>

        <div class="page-content">
            <div class="page-title">
                <h2>⚙️ Editar e Excluir Infrações</h2>
                <p>Gerencie o catálogo de infrações do sistema</p>
            </div>

            <section class="card">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Categoria</th>
                            <th>Artigo</th>
                            <th>Valor Base (R$)</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-acoes">
                        <!-- O JS vai injetar os dados aqui -->
                    </tbody>
                </table>
            </section>
        </div>
    </main>

    <!-- Caminho atualizado para a pasta JS com a nova rota -->
    <script src="/js/sidebar.js"></script>
    <script src="/cadastro-infracao/js/editar_excluir.js"></script>
    <script src="/js/formatadores.js"></script>
    <script src="/js/modal.js"></script>
</body>
</html>
