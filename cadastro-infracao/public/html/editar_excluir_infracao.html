<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar e Excluir - SIGAI</title>
    
    <!-- CSS Global (Sidebar e Header) -->
    <link rel="stylesheet" href="/css/home.css">
    
    <!-- CSS Padronizado do Sistema (Substitui o antigo style.css) -->
    <link rel="stylesheet" href="/cadastro-fiscal/css/Cadastro-fiscal.css">
    <style>
        #tabela-acoes tr[data-infracao-id] { cursor: pointer; }
        #tabela-acoes tr[data-infracao-id]:focus-visible { outline: 2px solid var(--fiscal-blue); outline-offset: -2px; }
        #tabela-acoes tr[data-infracao-id].is-selected { background: #eef4ff; }
        #acoes-infracao-selecionada[hidden] { display: none; }
    </style>

    
    <!-- Font Awesome (Ícones do menu) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-fiscal-page="editar-infracao">

    <!-- O script de layout procura esta div para injetar o menu lateral e o topo -->
    <div class="main-container">
        <div class="page-content">
            
            <!-- CABEÇALHO PADRONIZADO -->
            <div class="fiscal-page-heading">
                <div class="fiscal-heading-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </div>
                <div>
                    <h2>Editar e Excluir Infrações</h2>
                    <p>Gerencie o catálogo de infrações do sistema</p>
                </div>
            </div>

            <!-- Cartão da Tabela de Resultados -->
            <section class="fiscal-card">
                <div class="fiscal-card-body">
                    <div class="fiscal-table-wrap">
                        <table class="fiscal-table">
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Descrição</th>
                                    <th>Categoria</th>
                                    <th>Artigo</th>
                                    <th>Valor Base (R$)</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-acoes">
                                <!-- O JS vai injetar os dados aqui -->
                            </tbody>
                        </table>
                    </div>
                    <p class="fiscal-helper-text">Clique em uma infração para selecioná-la.</p>
                    <div id="acoes-infracao-selecionada" class="fiscal-form-actions" hidden>
                        <span id="infracao-selecionada-label" class="fiscal-helper-text"></span>
                        <button class="fiscal-button is-primary" type="button" id="btn-editar-infracao">Editar</button>
                        <button class="fiscal-button is-danger" type="button" id="btn-excluir-infracao">Excluir</button>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- 1. O script original que traz os estilos da barra lateral -->
    <script src="/js/sidebar.js"></script>
    
    <!-- 2. O nosso script que injeta o menu padronizado e o cabeçalho novo -->
    <script src="/cadastro-fiscal/js/fiscal-layout.js"></script>
    
    <!-- Restantes scripts da página -->
    <script src="/cadastro-infracao/js/editar_excluir.js"></script> <!-- ou pesquisar.js / editar_excluir.js -->
    <script src="/js/formatadores.js"></script>
    <script src="/js/modal.js"></script>
    <script src="/js/unsaved-changes.js"></script>
</body>
</html>
