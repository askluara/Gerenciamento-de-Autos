<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisar Infrações - SIGAI</title>
    
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/cadastro-fiscal/css/Cadastro-fiscal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-fiscal-page="pesquisar-infracao">

    <div class="main-container">
        <div class="page-content">
            
            <div class="fiscal-page-heading">
                <div class="fiscal-heading-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.3-4.3"/>
                    </svg>
                </div>
                <div>
                    <h2>Pesquisar Infrações</h2>
                    <p>Consulte e filtre os tipos de infração cadastrados no sistema</p>
                </div>
            </div>

            <section class="fiscal-card">
                <div class="fiscal-card-header">
                    <h3>Filtros de Busca</h3>
                </div>
                <div class="fiscal-card-body">
                    <form id="form-pesquisa">
                        <div class="fiscal-form-grid">
                            <!-- Campo Código removido -->
                            <div class="fiscal-field">
                                <label>Descrição</label>
                                <input type="text" id="filtro_descricao" placeholder="Palavra-chave na descrição">
                            </div>
                            <div class="fiscal-field">
                                <label>Categoria</label>
                                <!-- Transformado em Select -->
                                <select id="filtro_categoria">
                                    <option value="">Todas as categorias</option>
                                    <option value="Sanitária">Sanitária</option>
                                    <option value="Ambiental">Ambiental</option>
                                    <option value="Posturas Municipais">Posturas Municipais</option>
                                    <option value="Funcionamento Irregular">Funcionamento Irregular</option>
                                    <option value="Outra">Outra</option>
                                </select>
                            </div>
                        </div>
                        <div class="fiscal-form-actions" style="margin-top: 20px;">
                            <button type="submit" class="fiscal-button is-primary">
                                <i class="fa-solid fa-magnifying-glass"></i> Pesquisar
                            </button>
                            <button type="button" class="fiscal-button" onclick="document.getElementById('form-pesquisa').reset(); carregarInfracoes();">
                                ✖ Limpar Filtros
                            </button>
                        </div>
                    </form>
                </div>
            </section>

            <section class="fiscal-card">
                <div class="fiscal-card-body">
                    <div class="fiscal-table-wrap">
                        <table class="fiscal-table">
                            <thead>
                                <tr>
                                    <!-- Coluna Código removida -->
                                    <th>Descrição</th>
                                    <th>Categoria</th>
                                    <th>Artigo</th>
                                    <!-- Atualizado para UFMs para manter a coerência com o cadastro -->
                                    <th>UFMs</th> 
                                </tr>
                            </thead>
                            <tbody id="tabela-resultados">
                                <!-- O JavaScript vai injetar os dados aqui -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
            
        </div>
    </div>

    <script src="/js/sidebar.js"></script>
    <script src="/cadastro-fiscal/js/fiscal-layout.js"></script>
    <script src="/cadastro-infracao/js/pesquisar.js"></script> 
    <script src="/js/formatadores.js"></script>
    <script src="/js/modal.js"></script>
</body>
</html>
