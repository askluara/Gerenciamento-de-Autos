<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inativar Fiscal | SIGAI</title>
    <link rel="stylesheet" href="css/Cadastro-fiscal.css">
    <link rel="stylesheet" href="/css/notificacoes.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body data-fiscal-page="inativar">
    <div class="main-container">
        <div class="content-wrapper">
            <div class="fiscal-page-heading">
                <span class="fiscal-heading-icon is-danger" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a7 7 0 0 1 11-5.7M18 16l5 5M23 16l-5 5"/></svg>
                </span>
                <div>
                    <h2>Inativar Fiscal</h2>
                    <p>Registre a inativação de um fiscal no sistema</p>
                </div>
            </div>

            <section class="fiscal-card" aria-label="Localizar fiscal">
                <header class="fiscal-card-header"><h3>Localizar Fiscal</h3></header>
                <div class="fiscal-card-body">
                    <div class="fiscal-inline-search">
                        <div class="fiscal-field fiscal-search-field">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
                            <label class="visually-hidden" for="filtro-termo">Buscar por nome, matrícula ou CPF</label>
                            <input type="search" id="filtro-termo" placeholder="Buscar por nome, matrícula ou CPF..." autocomplete="off">
                        </div>
                        <button class="fiscal-button is-primary" type="button" id="btn-pesquisar" aria-label="Pesquisar fiscais">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
                            Pesquisar
                        </button>
                    </div>
                    <p id="mensagem-busca-inativar" class="fiscal-helper-text">Digite o nome, matrícula ou CPF do fiscal para localizá-lo.</p>
                    <div id="resultados-inativar" class="fiscal-results" hidden>
                        <div class="fiscal-table-wrap">
                            <table class="fiscal-table">
                                <thead><tr><th>Matrícula</th><th>Nome</th><th>Status</th><th class="is-centered">Ação</th></tr></thead>
                                <tbody id="tabela-resultados-inativar"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="/js/sidebar.js"></script>
    <script src="js/fiscal-layout.js"></script>
    <script src="/js/notificacoes.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/inativar-fiscal.js"></script>
    <script src="/js/formatadores.js"></script>
    <script src="/js/modal.js"></script>
</body>
</html>
