<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Fiscal | SIGAI</title>
    <link rel="stylesheet" href="css/Cadastro-fiscal.css">
    <link rel="stylesheet" href="/css/notificacoes.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body data-fiscal-page="editar">
    <div class="main-container">
        <div class="content-wrapper">
            <div class="fiscal-page-heading">
                <span class="fiscal-heading-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>
                </span>
                <div>
                    <h2>Editar Fiscal</h2>
                    <p>Atualize os dados cadastrais de um fiscal</p>
                </div>
            </div>

            <section class="fiscal-card" aria-label="Localizar fiscal">
                <header class="fiscal-card-header"><h3>Localizar Fiscal</h3></header>
                <div class="fiscal-card-body">
                    <div class="fiscal-inline-search">
                        <div class="fiscal-field fiscal-search-field">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
                            <label class="visually-hidden" for="filtro-termo">Buscar por nome, matrícula ou CPF</label>
                            <input type="search" id="filtro-termo" placeholder="Buscar por nome, matrícula ou CPF...">
                        </div>
                        <button class="fiscal-button is-primary" type="button" id="btn-pesquisar">Pesquisar</button>
                    </div>
                    <p id="mensagem-busca-editar" class="fiscal-helper-text">Digite o nome, matrícula ou CPF do fiscal para localizá-lo.</p>
                    <div id="resultados-editar" class="fiscal-results" hidden>
                        <div class="fiscal-table-wrap">
                            <table class="fiscal-table">
                                <thead><tr><th>Matrícula</th><th>Nome</th><th>CPF</th><th class="is-centered">Ação</th></tr></thead>
                                <tbody id="tabela-resultados-busca"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>

            <form id="form-edicao" class="fiscal-card fiscal-edit-form" hidden>
                <header class="fiscal-card-header"><h3 id="titulo-form">Dados do Fiscal Selecionado</h3></header>
                <div class="fiscal-card-body">
                    <div class="fiscal-form-section">
                        <div class="fiscal-form-grid">
                            <div class="fiscal-field">
                                <label for="matricula">Matrícula</label>
                                <input type="text" id="matricula" readonly>
                            </div>
                            <div class="fiscal-field">
                                <label for="nome">Nome Completo</label>
                                <input type="text" id="nome">
                            </div>
                            <div class="fiscal-field">
                                <label for="cpf">CPF</label>
                                <input type="text" id="cpf">
                            </div>
                            <div class="fiscal-field">
                                <label for="email">E-mail</label>
                                <input type="email" id="email">
                            </div>
                            <div class="fiscal-field">
                                <label for="telefone">Telefone</label>
                                <input type="tel" id="telefone">
                            </div>
                        </div>
                    </div>

                    <section class="fiscal-form-section">
                        <h4 class="fiscal-form-section-title">Vínculo Funcional</h4>
                        <div class="fiscal-form-grid">
                            <div class="fiscal-field">
                                <label for="cargo_id">Cargo / Função</label>
                                <select id="cargo_id" required><option value="">Selecione o cargo</option></select>
                            </div>
                            <div class="fiscal-field">
                                <label for="setor_id">Setor / Departamento</label>
                                <select id="setor_id" required><option value="">Selecione o setor</option></select>
                            </div>
                            <div class="fiscal-field">
                                <label for="nivel_acesso_id">Nível de Acesso</label>
                                <select id="nivel_acesso_id" required><option value="">Selecione o nível de acesso</option></select>
                            </div>
                        </div>
                    </section>

                    <div class="fiscal-form-section">
                        <div class="fiscal-field">
                            <label for="observacao">Observações</label>
                            <textarea id="observacao"></textarea>
                        </div>
                    </div>

                    <div class="fiscal-form-actions">
                        <button class="fiscal-button is-primary" type="button" id="btn-salvar">Salvar Alterações</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="js/fiscal-layout.js"></script>
    <script src="/js/notificacoes.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/editar-fiscal.js"></script>
</body>
</html>
