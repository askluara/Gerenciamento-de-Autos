<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Editar Parecer | SIGAI</title><link rel="stylesheet" href="/css/home.css"><link rel="stylesheet" href="/cadastro-fiscal/css/Cadastro-fiscal.css"><link rel="stylesheet" href="/parecer_auto/css/parecer.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></head>
<body data-fiscal-page="editar-parecer"><main class="main-container"><div class="content-wrapper">
    <div class="fiscal-page-heading"><span class="fiscal-heading-icon" aria-hidden="true"><i class="fa-solid fa-pen-to-square"></i></span><div><h2>Editar Parecer</h2><p>Altere apenas a decisão e a fundamentação do parecer</p></div></div>
    <section class="fiscal-card"><div class="fiscal-card-body"><form id="form-buscar-parecer"><div class="fiscal-inline-search"><div class="fiscal-field"><label for="busca-parecer">Número do Auto ou do Parecer</label><input id="busca-parecer" placeholder="Ex.: PAR-2026-042"></div><button class="fiscal-button is-primary" type="submit"><i class="fa-solid fa-magnifying-glass"></i> Buscar</button><button class="fiscal-button" type="button" id="limpar-busca-parecer">Mostrar todos</button></div></form></div></section>
    <section class="fiscal-card"><div class="fiscal-card-header"><h3>Pareceres cadastrados</h3></div><div class="fiscal-card-body"><p id="mensagem-editar-parecer" class="parecer-rule" role="status"></p><div class="fiscal-table-wrap"><table class="fiscal-table"><thead><tr><th>Parecer</th><th>Número do Auto</th><th>Contribuinte</th><th>Decisão</th><th>Data</th></tr></thead><tbody id="lista-editar-parecer"></tbody></table></div></div></section>
    <form id="form-editar-parecer" hidden>
        <section class="fiscal-card"><div class="fiscal-card-header"><h3>Identificação</h3></div><div class="fiscal-card-body"><div class="fiscal-form-grid is-three-column">
            <div class="fiscal-field"><label>Número do Auto</label><input id="edit-auto" readonly></div><div class="fiscal-field"><label>Parecer</label><input id="edit-parecer" readonly></div><div class="fiscal-field"><label>Contribuinte</label><input id="edit-contribuinte" readonly></div><div class="fiscal-field"><label>CPF/CNPJ</label><input id="edit-documento" readonly></div><div class="fiscal-field"><label>Data de registro</label><input id="edit-data" readonly></div>
        </div></div></section>
        <section class="fiscal-card"><div class="fiscal-card-header"><h3>Dados Editáveis</h3></div><div class="fiscal-card-body"><div class="fiscal-form-grid"><div class="fiscal-field"><label for="edit-decisao">Decisão / Status <span class="required">*</span></label><select id="edit-decisao" required><option value="Procedente">Procedente</option><option value="Improcedente">Improcedente</option></select></div><div class="fiscal-field is-full"><label for="edit-fundamentacao">Fundamentação / Observação <span class="required">*</span></label><textarea id="edit-fundamentacao" required></textarea></div></div><p class="parecer-rule">* Campos obrigatórios. Somente a decisão e a fundamentação podem ser alteradas.</p></div></section>
        <div class="fiscal-form-actions"><button class="fiscal-button is-primary" type="submit"><i class="fa-solid fa-floppy-disk"></i> Gravar</button><button class="fiscal-button" type="button" id="cancelar-edicao">Cancelar</button></div>
    </form>
</div></main>
<script src="/js/sidebar.js"></script><script src="/cadastro-fiscal/js/fiscal-layout.js"></script><script src="/parecer_auto/js/editar-parecer.js"></script><script src="/js/modal.js"></script><script src="/js/unsaved-changes.js"></script></body></html>
